name: Build Bare-Hand Combat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Stardew mod build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build mod
        run: dotnet build BareHandCombatAndroid.csproj --configuration Release

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BareHandCombat-build-output
          path: |
            bin/Release/
            **/bin/Release/
          if-no-files-found: warn


name: Build Bare-Hand Combat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Stardew mod build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Build mod
        run: dotnet build --configuration Release

      - name: Upload mod ZIP artifacts
        uses: Pathoschild/SMAPI-ModBuildWorkflow/upload-release-artifacts@v1
        with:
          path: _releases
          
